# Baut, testet und veröffentlicht SimpleGrid, sobald ein Versions-Tag (z. B. v1.2.0) hochgeladen wird.
# Ergebnis: eine GitHub-Release mit SimpleGrid-Setup.exe und versionen.json (für die Update-Suche).
# Benutzt nur das automatische GITHUB_TOKEN der Aktion – kein eigener Zugangsschlüssel.
name: Release

on:
  push:
    tags: ["v*.*.*"]
    # Auf main nur bauen (ohne Veröffentlichung): füllt den Zwischenspeicher, den die Tags nutzen.
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Zwischenstände des Rust-Baus aufbewahren: spätere Releases bauen deutlich schneller.
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y
      - name: Bauen, testen, Installer
        shell: pwsh
        run: ./installer/bauen.ps1 -Version "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/SimpleGrid-Setup.exe dist/versionen.json --title "SimpleGrid ${{ github.ref_name }}" --notes "Neue Version von SimpleGrid."
